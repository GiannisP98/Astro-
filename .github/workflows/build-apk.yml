name: Build Bridge Astro APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply v0.2.1 final-safety patch
        run: python .github/patches/mobile_v021_final_safety.py
      - name: Verify patched source
        run: |
          grep -q 'ANDROID-0.2.1-FINAL-SAFETY' app/src/main/java/com/bridgeastro/mobile/MobileUpdater.java
          grep -q "versionName '0.2.1'" app/build.gradle
          grep -q 'failed/partial batch discarded' app/src/main/java/com/bridgeastro/mobile/MobileUpdater.java
          grep -q 'CANON|' app/src/main/java/com/bridgeastro/mobile/MobileUpdater.java
      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 35
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bridgeastro-debug-keystore-v1
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Bridge Astro Mobile Debug,O=Bridge Astro,C=GR" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK assets
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/bootstrap.html"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/world_msi_seed.json.gz.b64"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BridgeAstroMobile-v0.2.1-FINAL-SAFETY
          path: app/build/outputs/apk/debug/app-debug.apk
